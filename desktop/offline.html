<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Простая химия — нет связи</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: "Segoe UI", Roboto, system-ui, sans-serif; background: #f4f8f6; color: #16302a; }
    main { height: 100%; display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box; }
    img { width: 96px; height: 96px; border-radius: 24px; }
    h1 { font-size: 26px; margin: 18px 0 6px; }
    p { margin: 0 0 22px; color: #4c615a; font-size: 16px; max-width: 420px; }
    button { font: inherit; font-size: 16px; font-weight: 600; border: none; border-radius: 999px; padding: 12px 28px; background: #187a5f; color: #fff; cursor: pointer; }
    button:focus-visible { outline: 3px solid #7dd8b5; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div>
      <img src="icon.png" alt="">
      <h1>Нет связи с сайтом</h1>
      <p>Проверьте подключение к интернету. Как только связь появится, нажмите «Повторить».</p>
      <button id="retry" autofocus>Повторить</button>
    </div>
  </main>
  <script>
    const target = new URLSearchParams(location.search).get("u") || "";
    const go = () => { if (/^https:\/\//.test(target)) location.href = target; };
    document.getElementById("retry").addEventListener("click", go);
    // Сами пробуем снова, когда Windows сообщит, что интернет появился.
    window.addEventListener("online", go);
  </script>
</body>
</html>
